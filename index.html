<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Georgia, serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f5;
}

.calculator {
  background: #fff;
  padding: 25px;
  border: 1px solid #ddd;
  text-align: center;
  box-shadow: 0 0 10px rgba(0, 0, 0, .1);
}

h2 {
  margin-bottom: 15px;
  font-size: 22px;
}

input {
  width: 220px;
  height: 35px;
  margin-bottom: 15px;
  text-align: right;
  padding: 5px 10px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 50px);
  gap: 8px;
  justify-content: center;
}

button {
  width: 50px;
  height: 50px;
  border: 1px solid #888;
  background: #fff;
  cursor: pointer;
  font-size: 18px;
}

button:hover {
  background: #eee;
}
</style>
</head>
<body>

<div class="calculator">
  <h2>Welcome to Calculate me!</h2>

  <input type="text" readonly>

  <div class="buttons">
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>*</button>

    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>-</button>

    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>+</button>

    <button>0</button>
    <button>.</button>
    <button>=</button>
    <button>/</button>
  </div>
</div>
<script>
  let string = "";
let input = document.querySelector("input")
let btn = document.querySelectorAll("button")
Array.from(btn).forEach((val)=>{
  val.addEventListener("click",(e)=>{
    if (e.target.innerHTML == '=') {
      string = eval(string)
      input.value = string;
    }
    else {
      string = string + e.target.innerHTML;
    input.value = string;
    }
    
  })
})
</script>
</body>
</html>
